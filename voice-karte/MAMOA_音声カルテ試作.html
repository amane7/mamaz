<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MAMOA 音声カルテ（試作）</title>
<style>
:root{
  --pink:#f1b0b9; --blush:#f7c8ce; --rose:#efa4b0; --deep:#d98a94; --cream:#fff7f2; --beige:#fbefe8; --paper:#fffbf7;
  --m100:#ebd9de; --m200:#d5b4bb; --m300:#b78e96; --m400:#8e6a73; --m500:#6e4f58; --m700:#4a323b; --m800:#3a2a30;
  --sage50:#f5f9f3; --sage100:#e7efe6; --sage400:#9abf8f; --ok50:#eff7ee; --ok600:#5f8156; --ok-ink:#3e5f36;
  --sky50:#f1f6fa; --sky100:#e1ecf4; --sky500:#5c8bb0; --sky-ink:#35617f;
  --warn50:#fbf3e7; --warn500:#d8a85a; --warn-ink:#74500f;
  --ng600:#b85f6a; --rose-ink:#8e4a53; --tint50:#fdf4f5; --tint100:#fbe6ea; --gray50:#faf7f5; --rec:#a54553;
  --line:rgba(142,106,115,.16); --line2:rgba(142,106,115,.28);
  --shadow:0 1px 2px rgba(142,106,115,.06),0 8px 24px rgba(142,106,115,.08);
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#fbefe8}
body{margin:0;background:linear-gradient(180deg,var(--paper),var(--cream) 30%,var(--beige));background-attachment:fixed;color:var(--m700);font-family:var(--sans);font-size:15px;line-height:1.7;letter-spacing:.008em;font-feature-settings:'palt';min-height:100vh}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--round);color:var(--m800);line-height:1.45;margin:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
::selection{background:rgba(241,176,185,.4);color:var(--m800)}
:focus-visible{outline:3px solid rgba(217,138,148,.7);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{display:inline-flex;flex:none;vertical-align:middle}

/* 上の帯 */
.top{background:rgba(255,251,247,.92);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.top-in{max-width:1220px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;min-height:54px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.wordmark{font-family:var(--round);font-weight:700;letter-spacing:.14em;font-size:17px;color:var(--m800)}
.brand-sub{font-family:var(--round);font-weight:700;color:var(--m500);font-size:14px;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--rose-ink);font-weight:700;padding:8px 8px 8px 0;font-family:var(--round)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;line-height:1.6;white-space:nowrap;font-family:var(--round)}
.pill.proto{background:var(--tint100);color:var(--rose-ink)}
.pill.draft{background:var(--warn50);color:var(--warn-ink);border:1px solid rgba(216,168,90,.5)}
.pill.ok{background:var(--ok50);color:var(--ok-ink);border:1px solid rgba(127,160,115,.5)}
.pill.mute{background:var(--gray50);color:var(--m500);border:1px solid var(--line)}

.page{max-width:1220px;margin:0 auto;padding:22px 18px 110px}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:780px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--rose-ink);font-weight:700}
.label{font-family:var(--round);font-weight:700;color:var(--m800);font-size:16px;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--m500);line-height:1.65}
.hint.tight{margin:0 0 6px}
.empty{color:var(--m500);font-size:13.5px;padding:10px 2px}
.h2{font-size:20px}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid transparent;padding:9px 18px;font-family:var(--round);font-weight:700;font-size:14.5px;line-height:1.3;min-height:42px;background:none;transition:background .15s,border-color .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--rose));color:var(--m800);box-shadow:0 4px 14px rgba(217,138,148,.28)}
.btn.primary:hover{background:var(--deep)}
.btn.primary:disabled{background:var(--m100);color:var(--m400);box-shadow:none}
.btn.outline{border-color:var(--pink);color:var(--rose-ink);background:#fff}
.btn.outline:hover{background:var(--tint50)}
.btn.outline:disabled,.btn.ghost:disabled{opacity:.5}
.btn.ghost{color:var(--m500);background:#fff;border-color:var(--line2)}
.btn.ghost:hover{color:var(--m700);background:var(--gray50)}
.btn.danger{background:var(--rec);color:#fff}
.btn.link{padding:4px 6px;min-height:0;color:var(--rose-ink);text-decoration:underline;text-underline-offset:3px;border-radius:8px}
.btn.lg{padding:13px 26px;font-size:16px;min-height:50px}
.btn.sm{padding:6px 14px;font-size:13px;min-height:36px}
.link-btn{border:0;background:none;color:var(--rose-ink);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:3px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;font-family:var(--round)}
.link-btn.del{color:var(--m500)}
.icon-btn{border:0;background:none;color:var(--m400);padding:10px;border-radius:999px;display:inline-flex}
.icon-btn:hover{background:var(--tint50);color:var(--rose-ink)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* カード */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.card-title{font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-sub{font-family:var(--sans);font-weight:500;font-size:12.5px;color:var(--m500)}
.note{display:flex;gap:9px;align-items:flex-start;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.65}
.note .ic{margin-top:3px}
.note.sky{background:var(--sky50);border:1px solid var(--sky100);color:var(--sky-ink)}
.note.warn{background:var(--warn50);border:1px solid rgba(216,168,90,.45);color:var(--warn-ink)}
.note.ok{background:var(--ok50);border:1px solid rgba(127,160,115,.4);color:var(--ok-ink)}
.note ul{margin:4px 0 0;padding-left:1.2em}
.note.block{display:block}

/* 一覧 */
.hero{padding:26px 4px 8px}
.hero h1{font-size:clamp(1.55rem,4.6vw,2.3rem);line-height:1.4;margin:8px 0 12px}
.lead{max-width:40em;color:var(--m500);font-size:15.5px}
.hero-actions{margin:20px 0 6px}
.hero .note{margin-top:14px;max-width:44em}
.home > .block{margin-top:30px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.ex .card-title{margin-bottom:2px}
.ex-sub{font-size:12.5px;color:var(--m500);margin-bottom:8px}
.ex-checks{margin:0 0 12px;padding-left:1.15em;font-size:13px;color:var(--m700)}
.ex-checks li{margin:3px 0}
.ex-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex{display:flex;flex-direction:column}
.ex .ex-actions{margin-top:auto}
.rec-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rec-item{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rec-open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.rec-open:hover{background:var(--tint50)}
.rec-title{font-family:var(--round);font-weight:700;color:var(--m800)}
.rec-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec-sub{font-size:12.5px;color:var(--m500)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.foot{margin-top:34px;color:var(--m500);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.foot .ver{color:var(--m400)}
.script{max-height:52vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.script p{margin:6px 0}
.help h4{font-size:14.5px;margin:14px 0 4px}
.help ul{margin:0;padding-left:1.2em;font-size:13.5px}
.help li{margin:4px 0}

/* 記録の見出しとタブ */
.rec-head{position:sticky;top:0;z-index:20;background:rgba(255,247,242,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rec-head-in{max-width:1220px;margin:0 auto;padding:8px 18px 0}
.rec-name{font-family:var(--round);font-weight:700;color:var(--m800);font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-date{font-weight:500;color:var(--m500);font-size:13.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 12px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--m500);font-family:var(--round);font-weight:700;font-size:14px;border-bottom:3px solid transparent;position:relative}
.tab-n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--m200);font-size:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--m500);background:#fff}
.tab.on{color:var(--rose-ink);border-bottom-color:var(--deep)}
.tab.on .tab-n{background:var(--rose);border-color:var(--ng600);color:var(--m800)}
.tab-badge{background:var(--warn500);color:#3d2a05;border-radius:999px;font-size:11px;min-width:19px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}

/* 入力 */
.field{display:block;margin:12px 0 0}
.field-label{font-size:12.5px;font-weight:700;color:var(--m500);margin-bottom:5px;font-family:var(--round)}
.inp{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:8px 11px;font-size:16px;color:var(--m800);min-height:40px;max-width:100%}
.inp:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(241,176,185,.3)}
.inp:disabled{background:var(--gray50);color:var(--m700);opacity:1;-webkit-text-fill-color:var(--m700)}
.inp::placeholder{color:var(--m300)}
.inp.txt{width:100%}
.inp.num{width:4.1em;text-align:center;padding:8px 4px}
.inp.num.w4{width:5.8em}
.inp.area{width:100%;resize:vertical;line-height:1.6;display:block}
.inp.sel{padding-right:6px;min-width:6.5em}
.inp.time{width:9.5em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip,.chipbtn{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--m500);min-height:38px;font-family:var(--round)}
.chip.on{background:var(--rose);border-color:var(--ng600);color:var(--m800);box-shadow:inset 0 0 0 1px var(--ng600)}
.chip.sug{border-style:dashed;border-color:var(--deep);color:var(--rose-ink);background:var(--tint50)}
.chip:disabled{opacity:.75}
.chipbtn{display:inline-flex;align-items:center;color:var(--rose-ink);border-color:var(--pink)}
.chipbtn:hover{background:var(--tint50)}
.chipbtn.hold{color:var(--warn-ink);border-color:var(--warn500);background:var(--warn50)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:5px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--deep);margin:2px 0 0;flex:none}
.check.sm{font-size:12.5px;color:var(--m500)}
.checks-row{display:flex;gap:18px;margin-top:8px}
.kids{display:flex;flex-direction:column;gap:8px}
.kid{display:flex;align-items:center;gap:8px}
.kid-n{font-family:var(--round);font-weight:700;color:var(--m500);font-size:13px;width:2.4em;flex:none}
.mini-field{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--m500);font-weight:700}
.mini-field.col{flex-direction:column;align-items:flex-start}
.mini-field .inp{font-weight:400}
.add-line{border:1.5px dashed var(--m200);background:none;color:var(--rose-ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--round);min-height:38px}
.add-line:hover{background:var(--tint50)}
.next-step{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 4px}
.next-step-txt{font-size:13.5px;color:var(--m500);flex:1;min-width:14em}
.tool-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.tool-row.wrap{flex-wrap:wrap}

/* 記録のもとを選ぶ */
.choice{display:flex;gap:14px;align-items:center}
.choice-ic{width:46px;height:46px;border-radius:14px;background:var(--tint100);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;flex:none}
.choice-body{flex:1;min-width:0}
.choice-body p{font-size:13.5px;color:var(--m500)}
.choice .card-title{margin-bottom:2px}
.label-map{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0;padding:10px 12px;background:var(--gray50);border-radius:12px}
.label-map .field-label{flex-basis:100%;margin:0}
.consent{background:var(--sage50);border:1px solid var(--sage100);border-radius:14px;padding:8px 14px;margin:12px 0}
.imp-preview{margin-top:12px;border-top:1px dashed var(--m200);padding-top:10px}
.imp-sample{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}

/* ---- ライブ記入（録音しながらカルテに入れる） ---- */
:root{--lav50:#f5f1f9;--lav100:#eae0f1;--lav300:#bfa9d3;--lav500:#8b72a9;--lav-ink:#5d4879}
.page.rec.tab-talk:has(.live2){padding-bottom:150px}
.live2{display:flex;flex-direction:column;gap:12px}
.live-kind{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.live-tabs{display:inline-flex;align-self:flex-start;border:1px solid var(--line2);border-radius:999px;background:#fff;padding:3px;position:sticky;top:92px;z-index:12;box-shadow:var(--shadow)}
.ltab{border:0;background:none;border-radius:999px;padding:7px 16px;font-family:var(--round);font-weight:700;font-size:14px;color:var(--m500);display:inline-flex;align-items:center;gap:6px;min-height:38px}
.ltab.on{background:var(--tint100);color:var(--rose-ink)}
.ltab-n{background:var(--m100);color:var(--m700);border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}
.live-grid{display:flex;flex-direction:column;gap:12px}
.live-side{display:contents}
#live-moa,.live-tabs{order:0}
.live-doc,.live-pane{order:1;display:none}
.live2[data-tab=karte] .live-doc{display:flex}
.live2[data-tab=talk] .pane-talk{display:flex}
.live2[data-tab=notes] .pane-notes{display:flex}
.live-doc{flex-direction:column;gap:10px;min-width:0}
.lk-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.lk-title{font-family:var(--round);font-weight:700;color:var(--m800);font-size:15px;display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.lk-sub{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--m500)}
.lk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px}
.lk-row{display:flex;align-items:baseline;gap:8px;padding:5px 6px;border-radius:10px;min-height:34px;transition:background .6s}
.lk-k{font-size:12.5px;color:var(--m500);font-weight:700;font-family:var(--round);width:6.2em;flex:none}
.lk-v{border:0;background:none;padding:0;text-align:left;font-family:var(--round);font-weight:700;font-size:15.5px;color:var(--m800);display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.lk-v:disabled{cursor:default}
.lk-v.none{font-weight:400;color:var(--m300);font-size:14px}
.lk-row.fresh,.lk-lines li.fresh,.ln-row.fresh{background:#fdeef1;box-shadow:inset 3px 0 0 var(--deep)}
.prov{font-size:10.5px;font-weight:700;color:var(--rose-ink);border:1px dashed var(--deep);border-radius:6px;padding:0 5px;font-family:var(--round);white-space:nowrap;line-height:1.5;background:#fff}
.lk-sec{margin-top:6px}
.lk-sec-k{font-size:12.5px;color:var(--m500);font-weight:700;font-family:var(--round)}
.lk-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lk-lines li{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:5px 6px;border-radius:10px;transition:background .6s;font-size:14.5px;color:var(--m800)}
.lk-lines li.hold{background:var(--warn50)}
.lk-tag{font-size:10.5px;font-weight:700;border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--m500);background:var(--gray50);white-space:nowrap;font-family:var(--round)}
.lk-line{border:0;background:none;padding:0;text-align:left;font-size:14.5px;color:var(--m800);line-height:1.6;flex:1;min-width:10em}
.lk-line:disabled{cursor:default}
.lk-none{color:var(--m300);padding:2px 6px}
.lk-breasts{display:flex;gap:14px;justify-content:flex-start;margin:0 0 4px}
.lk-breasts figure{margin:0;text-align:center}
.lk-breasts .breast.print{width:78px;height:78px}
.lk-breasts figcaption{font-size:11px;color:var(--m500);font-weight:700}
.live-pane{flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);min-height:180px}
.pane-head{display:flex;align-items:center;gap:6px;font-family:var(--round);font-weight:700;color:var(--m800);font-size:14.5px;flex-wrap:wrap;margin-bottom:4px}
.pane-head .hint{font-weight:400;font-family:var(--sans)}
.live-pane .tscroll{max-height:52vh;min-height:120px}
.utt-text.plain{padding:1px 2px;font-size:15px;line-height:1.65;color:var(--m800)}
.live-interim{color:var(--m300);min-height:1.7em;padding:4px 10px 4px 5.2em;font-size:15px}
.ln-row{display:flex;align-items:baseline;gap:8px;padding:6px 6px;border-radius:10px;transition:background .6s}
.ln-text{flex:1;font-size:14.5px;color:var(--m800);line-height:1.6}
.icon-btn.sm{padding:4px}
.note-tag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap;font-family:var(--round);background:var(--gray50);color:var(--m500);border:1px solid var(--line)}
.note-tag.t-0{background:var(--warn50);color:var(--warn-ink);border-color:rgba(216,168,90,.5)}
.note-tag.t-1{background:var(--sky50);color:var(--sky-ink);border-color:var(--sky100)}
.note-tag.t-2{background:var(--sage50);color:var(--ok-ink);border-color:var(--sage100)}
.note-tag.t-3{background:var(--tint50);color:var(--rose-ink);border-color:var(--tint100)}
.note-tag.t-4{background:#fff;color:var(--m700);border-color:var(--line2)}
.note-add{display:flex;gap:8px;margin-top:8px}
.note-add .inp{flex:1;min-width:0}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.note-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.note-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note-item .line-foot .del{margin-left:auto}

/* MOA の問い */
.moa{background:linear-gradient(160deg,var(--lav50),#fff 85%);border:1px solid rgba(191,169,211,.55);border-radius:20px;padding:12px 14px;box-shadow:0 6px 22px rgba(139,114,169,.12)}
.moa-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.moa-face{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--lav100),var(--lav300));color:#fff;font-family:var(--round);font-weight:700;font-size:10.5px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;flex:none;text-shadow:0 0 2px rgba(93,72,121,.6)}
.moa-title{font-size:15px;color:var(--lav-ink);display:flex;align-items:center;gap:6px}
.moa-n{background:var(--lav500);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}
.moa-sub{font-size:11.5px;color:var(--m500);line-height:1.5}
.moa-list{display:flex;flex-direction:column;gap:8px}
.moa.live .moa-list{max-height:44vh;overflow:auto}
.moa-q{background:#fff;border:1px solid rgba(191,169,211,.5);border-radius:16px 16px 16px 4px;padding:10px 12px}
.moa-q.k-ask{border-color:var(--lav300);box-shadow:inset 3px 0 0 var(--lav300)}
.moa-text{font-family:var(--round);font-weight:700;color:var(--m800);font-size:15.5px;line-height:1.5}
.moa.live .moa-q.first .moa-text{font-size:18px}
.moa-who{display:inline-block;font-size:11.5px;background:var(--lav100);color:var(--lav-ink);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:middle}
.moa-why{font-size:12.5px;color:var(--m500);margin-top:2px}
.moa-src{margin-top:6px}
.moa-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.moa-btn{border:1.5px solid var(--lav300);background:var(--lav50);color:var(--lav-ink);border-radius:999px;padding:6px 14px;font-family:var(--round);font-weight:700;font-size:13.5px;min-height:38px}
.moa-btn:hover{background:var(--lav100)}
.moa-btn.mute{background:#fff;border-color:var(--line2);color:var(--m500)}
.moa-btn.hold{background:var(--warn50);border-color:var(--warn500);color:var(--warn-ink)}
.moa-empty{font-size:14px;color:var(--m500);padding:4px 2px}
.moa-more{font-size:12px;color:var(--m500);margin-top:6px}
.moa-toggle{display:none;border:0;background:none;color:var(--lav-ink);font-family:var(--round);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px 2px 2px;min-height:36px}
@media (max-width:1059px){
  .moa.live:not(.open) .moa-q:not(.first),.moa.live:not(.open) .moa-more{display:none}
  .moa.live .moa-toggle{display:inline-block}
  .moa.live .moa-sub{display:none}
  .moa.live{padding:10px 12px}
  .moa.live .moa-head{margin-bottom:6px}
}

/* 録音の帯（画面の下に浮かぶ） */
.rec-pill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;background:var(--rec);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:700;box-shadow:0 10px 30px rgba(165,69,83,.4);max-width:calc(100vw - 20px);white-space:nowrap}
.rec-pill.stopped{background:var(--m500);box-shadow:0 10px 30px rgba(58,42,48,.3)}
.rec-dot{width:11px;height:11px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;flex:none}
.rec-pill.stopped .rec-dot{animation:none;opacity:.5}
.rec-clock{font-size:16px}
.rec-bars{display:inline-flex;align-items:center;gap:3px;height:18px}
.rec-bars i{width:3px;height:6px;border-radius:2px;background:rgba(255,255,255,.75)}
.rec-pill.hearing .rec-bars i{animation:bars .7s ease-in-out infinite}
.rec-pill.hearing .rec-bars i:nth-child(2){animation-delay:.12s}
.rec-pill.hearing .rec-bars i:nth-child(3){animation-delay:.24s}
.rec-pill.hearing .rec-bars i:nth-child(4){animation-delay:.36s}
.rec-pill[data-done="1"] .rec-dot{animation:none}
.rec-stop{border:0;background:#fff;color:var(--rec);border-radius:999px;padding:9px 16px;font-family:var(--round);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.rec-pill.stopped .rec-stop{color:var(--m700)}
.rec-more{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes bars{0%,100%{height:5px}50%{height:17px}}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* 自動で入れたまま、まだ確かめていないもの */
.dec-pill.auto{background:var(--tint100);color:var(--rose-ink);border:1px dashed var(--deep)}
.cand.done.auto{background:var(--tint50);border:1.5px dashed var(--deep)}
.cand.done.auto.editing{display:block}
.auto-acts{display:inline-flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.frow.is-prov .frow-inputs .inp,.line.is-prov{border-style:dashed;border-color:var(--deep)}
.frow.is-prov .frow-inputs .inp{background:var(--tint50)}
.count.auto.hot{background:var(--tint100);border-color:var(--deep);color:var(--rose-ink)}
.bulk-ok{border:1.5px solid rgba(127,160,115,.8);background:var(--ok50);color:var(--ok-ink);border-radius:999px;padding:6px 14px;font-family:var(--round);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;min-height:36px;margin:0 0 8px}
.bulk-ok:hover{background:var(--sage100)}
.tag-sel.move{background:#fff;color:var(--m500);font-weight:500}

@media (max-width:640px){
  .rec-pill{left:10px;right:10px;transform:none;justify-content:space-between;padding-left:14px;gap:8px}
  .rec-bars{display:none}
  .rec-stop{padding:9px 13px}
}
@media (min-width:1060px){
  .live-tabs [data-ltab=karte]{display:none}
  .live-tabs{position:static;box-shadow:none;margin:0}
  .live-grid{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px;align-items:start}
  .live-doc{display:flex !important;order:0}
  .live-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:104px;max-height:calc(100vh - 124px);min-height:0;order:1}
  .live2[data-tab=karte] .pane-talk{display:flex}
  .live-side .live-pane{flex:1;min-height:200px}
  .live-side .live-pane .tscroll{max-height:none;flex:1;min-height:0}
  .moa.live .moa-list{max-height:34vh}
}
@media (prefers-reduced-motion:reduce){.rec-pill.hearing .rec-bars i{animation:none}.lk-row,.lk-lines li,.ln-row{transition:none}}

/* 照合 */
.review{display:block}
.review-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.tpanel{display:none}
.review-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.count{font-size:12.5px;border-radius:999px;padding:3px 11px;background:#fff;border:1px solid var(--line);color:var(--m500);font-weight:700;font-family:var(--round)}
.count b{font-family:var(--mono);font-size:13.5px;color:var(--m800)}
.count.none.hot{background:var(--warn50);border-color:rgba(216,168,90,.6);color:var(--warn-ink)}
.review-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;background:#fff;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;color:var(--m500);font-family:var(--round);min-height:32px}
.seg button.on{background:var(--tint100);color:var(--rose-ink)}
.warn-card{border-color:rgba(216,168,90,.6);background:linear-gradient(180deg,var(--warn50),var(--paper) 70%)}
.warn-card .card-title{color:var(--warn-ink)}
.frow{padding:10px 0;border-top:1px solid var(--line)}
.card-title + .frow,.hint + .frow,.marks + .frow{border-top:0}
.frow-main{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.frow-label{font-family:var(--round);font-weight:700;color:var(--m800);font-size:14px;width:7.2em;flex:none}
.frow.block > .frow-label{width:auto;margin-bottom:6px}
.frow-inputs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.frow-inputs .grow{flex:1;min-width:9em;width:auto}
.unit{font-size:13.5px;color:var(--m500);white-space:nowrap}
.has-sug .inp::placeholder{color:var(--rose-ink);opacity:.85;font-style:italic}
.has-sug .inp:placeholder-shown{border-style:dashed;border-color:var(--deep);background:var(--tint50)}
.sug-tag{font-size:11px;font-weight:700;color:var(--rose-ink);border:1px dashed var(--deep);border-radius:6px;padding:0 5px;font-family:var(--round)}
.blank-sel{border:1px dashed var(--m200);background:none;border-radius:999px;font-size:12px;color:var(--m400);padding:5px 6px;max-width:11em;min-height:32px}
.blank-sel.set{border-style:solid;border-color:var(--m300);color:var(--m700);background:var(--gray50);font-weight:700}
.frow-src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 0 0}
.frow-src-k{font-size:11px;color:var(--m400);font-weight:700;font-family:var(--round)}
.manual-tag{font-size:11.5px;color:var(--m500);background:var(--gray50);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.cands{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cand{border-radius:14px;padding:10px 12px}
.cand.open{background:var(--tint50);border:1.5px dashed var(--deep)}
.cand-head{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.cand-kicker{font-size:11px;font-weight:700;color:var(--rose-ink);letter-spacing:.06em;font-family:var(--round)}
.cand-val{font-family:var(--round);font-weight:700;color:var(--m800);font-size:15.5px;overflow-wrap:anywhere}
.badge{font-size:11.5px;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap;font-family:var(--round)}
.badge.warn{background:var(--warn50);color:var(--warn-ink);border:1px solid rgba(216,168,90,.6)}
.badge.info{background:var(--sky50);color:var(--sky-ink);border:1px solid var(--sky100)}
.badge.ok{background:var(--ok50);color:var(--ok-ink);border:1px solid rgba(127,160,115,.4)}
.badge.mute{background:#fff;color:var(--m500);border:1px solid var(--line)}
.cand-srcs{display:flex;flex-direction:column;gap:4px;margin-top:6px;align-items:flex-start}
.src{border:0;background:#fff;border-radius:10px;padding:5px 9px;text-align:left;display:inline-flex;gap:8px;align-items:baseline;max-width:100%;border:1px solid var(--line);font-size:12.5px;min-height:32px}
.src:hover:not(:disabled){border-color:var(--pink)}
.src:disabled{opacity:.7}
.src-who{font-weight:700;white-space:nowrap;font-family:var(--round);font-size:11.5px}
.src.sp-mw .src-who{color:var(--ok-ink)} .src.sp-mo .src-who{color:var(--rose-ink)} .src.sp-fa .src-who{color:var(--sky-ink)} .src.sp-un .src-who{color:var(--warn-ink)}
.src-quote{color:var(--m700);overflow:hidden;text-overflow:ellipsis}
.src.q{opacity:.85}
.src-quote.open{color:var(--m500);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.cand-note{font-size:12px;color:var(--m500);margin-top:6px}
.cand-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btn.dec{min-height:40px;padding:7px 15px;font-size:14px;background:#fff}
.btn.dec.adopt{border-color:rgba(127,160,115,.8);color:var(--ok-ink);background:var(--ok50)}
.btn.dec.adopt:hover{background:var(--sage100)}
.btn.dec.edit{border-color:rgba(92,139,176,.6);color:var(--sky-ink)}
.btn.dec.reject{border-color:var(--line2);color:var(--m500)}
.btn.dec.hold{border-color:rgba(216,168,90,.8);color:var(--warn-ink);background:var(--warn50)}
.cand.done{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:7px 10px}
.cand.done .cand-val{font-size:13.5px}
.cand.done .cand-srcs{flex-direction:row;margin:0}
.cand.done .src-quote{display:none}
.cand.done.reject .cand-val{text-decoration:line-through;color:var(--m400)}
.dec-pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;font-family:var(--round);white-space:nowrap}
.dec-pill.adopt{background:var(--ok50);color:var(--ok-ink)} .dec-pill.edit{background:var(--sky50);color:var(--sky-ink)}
.dec-pill.reject{background:var(--gray50);color:var(--m500)} .dec-pill.hold{background:var(--warn50);color:var(--warn-ink)}
.cand.done .link-btn{margin-left:auto}
.cand.compact .src-quote{display:none}
.cand.compact .cand-srcs{flex-direction:row;flex-wrap:wrap}
.cand.compact .cand-note{display:none}
.cand-edit{margin-top:8px;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line)}
.resolve{margin-top:8px;background:#fff;border-radius:12px;padding:10px;border:1px solid rgba(216,168,90,.6)}
.resolve-q{font-family:var(--round);font-weight:700;color:var(--m800);font-size:14px;margin-bottom:8px}
.resolve-a{display:flex;gap:6px;flex-wrap:wrap}
.resolve-foot{text-align:right}
.lines{display:flex;flex-direction:column;gap:8px}
.line{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.line.hold{border-color:rgba(216,168,90,.7);background:var(--warn50)}
.line .line-text{border:0;padding:4px 2px;min-height:34px;border-radius:6px;background:transparent;resize:none;overflow:hidden}
.tag-sel{align-self:flex-start;border:1px solid var(--line2);border-radius:999px;background:var(--gray50);font-size:12px;font-weight:700;color:var(--m700);padding:3px 6px;min-height:30px}
.line-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.line-foot .del{margin-left:auto}
.next-meta{display:flex;gap:8px 14px;flex-wrap:wrap}
.next-meta .inp{width:11em;min-height:34px;padding:5px 9px;font-size:14px}
.dx-card{border-color:rgba(217,138,148,.5)}
.pay summary{cursor:pointer;margin:0;list-style:none}
.pay summary::-webkit-details-marker{display:none}
.pay summary::before{content:"＋";color:var(--rose-ink);margin-right:2px}
.pay[open] summary::before{content:"－"}
.pay[open] summary{margin-bottom:8px}
.pay-items{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;align-items:center}
.pay-items .inp{width:10em}

/* 乳房図 */
.breasts,.sh-breasts{display:flex;gap:18px;justify-content:center;margin:2px 0 4px}
.breasts figure,.sh-breasts figure{margin:0;text-align:center}
.breasts figcaption{font-family:var(--round);font-weight:700;color:var(--m500);font-size:13px}
.breast{width:150px;height:150px;cursor:crosshair;touch-action:manipulation}
.breast.print{width:112px;height:112px;cursor:default}
.b-ring{fill:#fff;stroke:var(--m700);stroke-width:1.6}
.b-nip{fill:none;stroke:var(--m700);stroke-width:1.2}
.b-num{font-size:10px;fill:var(--m500);font-family:var(--mono)}
.b-tick{stroke:var(--m400);stroke-width:1}
.b-mark{fill:var(--deep);stroke:#fff;stroke-width:1.2}
.b-mark-n{font-size:9.5px;fill:#fff;font-weight:700;font-family:var(--mono)}
.mark-list{margin:6px 0 4px;padding-left:1.6em;font-size:14px}
.mark-list li{margin:4px 0}
.mark-list li > *{vertical-align:middle;margin-right:6px}
.mark-txt{font-weight:700;color:var(--m800);font-family:var(--round)}

/* 文字起こし */
.tscroll{overflow:auto;display:flex;flex-direction:column;gap:2px}
.tscroll.tall{max-height:56vh;border:1px solid var(--line);border-radius:14px;background:#fff;padding:6px;margin-top:8px}
.utt{display:flex;gap:8px;padding:7px 8px;border-radius:12px;align-items:flex-start}
.utt.focus{background:#fff3c9;box-shadow:inset 0 0 0 2px var(--warn500)}
.utt-page{display:block;margin:8px auto;padding:6px 10px}
.utt-meta{display:flex;flex-direction:column;gap:3px;align-items:flex-start;flex:none;width:4.3em}
.utt-time{border:0;background:none;font-family:var(--mono);font-size:11.5px;color:var(--m400);padding:0;display:inline-flex;align-items:center;gap:2px}
.utt-time.playable{color:var(--rose-ink);text-decoration:underline}
.sp-chip{border:1px solid transparent;border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 9px;font-family:var(--round);min-height:26px}
.sp-chip.sp-mw{background:var(--sage100);color:var(--ok-ink)} .sp-chip.sp-mo{background:var(--tint100);color:var(--rose-ink)}
.sp-chip.sp-fa{background:var(--sky100);color:var(--sky-ink)} .sp-chip.sp-un{background:var(--warn50);color:var(--warn-ink);border:1px dashed var(--warn500)}
.sp-chip.guess{border:1px dashed var(--warn500)}
.utt-body{flex:1;min-width:0}
.utt-text{border:0;background:none;text-align:left;padding:1px 2px;font-size:14.5px;line-height:1.65;color:var(--m800);border-radius:6px;width:100%}
.utt-text:hover:not(:disabled){background:var(--tint50)}
.utt-menu{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px;padding:7px;background:var(--gray50);border-radius:10px}
.utt-menu-k{font-size:11.5px;color:var(--m500);font-weight:700;flex-basis:100%}
.utt-menu .chipbtn{min-height:32px;padding:3px 11px;font-size:12.5px}
.script b.sp-mw{color:var(--ok-ink)} .script b.sp-mo{color:var(--rose-ink)} .script b.sp-fa{color:var(--sky-ink)} .script b.sp-un{color:var(--warn-ink)}
.fab{position:fixed;right:16px;bottom:18px;z-index:30;border:0;border-radius:999px;background:var(--m800);color:#fff;padding:12px 18px;font-family:var(--round);font-weight:700;display:inline-flex;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(58,42,48,.3)}
@media (min-width:1060px){
  .review{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
  .tpanel{display:flex;flex-direction:column;position:sticky;top:104px;max-height:calc(100vh - 124px);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 10px 10px 12px;box-shadow:var(--shadow)}
  .tpanel-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .tpanel-head h3{font-size:15.5px;display:flex;align-items:center;gap:6px}
  .tpanel-sub{font-size:12px;color:var(--m500)}
  .tpanel .tscroll{flex:1;min-height:0;padding-right:4px}
  .fab{display:none}
  .player-bar{left:auto;right:16px;bottom:16px}
}

/* 確認 */
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:14px;flex-wrap:wrap}
.checklist li.ok{background:var(--ok50);color:var(--ok-ink)}
.checklist li.ng{background:var(--warn50);color:var(--warn-ink)}
.ck-t{flex:1;font-weight:700;font-family:var(--round)}
.ok-card{border-color:rgba(127,160,115,.6);background:linear-gradient(180deg,var(--ok50),var(--paper) 80%)}
.ok-card .card-title{color:var(--ok-ink)}
.sheet-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#e9e2dd;padding:14px}

/* 計時 */
.time-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin-top:8px}
.time-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.time-row{display:flex;align-items:center;gap:4px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.total{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.total-k{font-size:12px;color:var(--m500);font-weight:700}
.total-v{font-family:var(--round);font-weight:700;font-size:21px;color:var(--m800)}
.total.good{border-color:rgba(127,160,115,.7);background:var(--ok50)} .total.bad{border-color:rgba(216,168,90,.7);background:var(--warn50)}
.auto-num{font-family:var(--round);font-weight:700;color:var(--m800);padding:8px 0}

/* 通知・モーダル */

.modal-wrap{position:fixed;inset:0;background:rgba(58,42,48,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}

.modal.wide{max-width:720px}
.modal-title{font-size:18px;margin-bottom:8px}
.modal .note{margin-top:12px}

.modal-wrap.as-sheet{align-items:flex-end;padding:0}
.as-sheet .modal{max-width:760px;border-radius:22px 22px 0 0;height:78vh;max-height:78vh;display:flex;flex-direction:column;padding:14px 12px 10px}
.tsheet{display:flex;flex-direction:column;min-height:0;flex:1}
.tsheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tsheet .tscroll{flex:1;min-height:0}
.player-bar{position:fixed;left:12px;bottom:12px;z-index:40;background:var(--paper);border:1px solid var(--line2);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--m500);max-width:min(340px,calc(100vw - 150px))}
.player-bar audio{width:100%;height:34px}

/* 帳票（紙のカルテと同じ並び） */

.sheet .v{display:inline-block;min-width:2.2em;border-bottom:1px solid #999;padding:0 3px;font-weight:700}

.sh-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:5px;font-size:12px}

.badge.llm{background:var(--lav50);color:var(--lav-ink);border:1px solid var(--lav300)}

/* ---- 実証モード：ボタン一つで開始 ---- */
.trial-panel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(165,69,83,.10);padding:18px 18px 16px;margin:14px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

.level.big{width:min(70vw,280px);height:12px;background:var(--line2)}

.plain-live{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 8px 110px;text-align:center}
.plain-state{display:flex;align-items:center;gap:10px;font-family:var(--round);font-weight:700;font-size:18px;color:var(--rec)}
.rec-dot.big{width:14px;height:14px;background:var(--rec);border-radius:50%;display:inline-block;animation:pulse 1.4s ease-in-out infinite}

.hint.center{text-align:center;max-width:28em}
.plain-notes{width:100%;max-width:520px;text-align:left;margin-top:8px}
.done .done-head{display:flex;gap:14px;align-items:center}
.done-ic{width:52px;height:52px;border-radius:50%;background:var(--ok50);color:var(--ok-ink);display:flex;align-items:center;justify-content:center;flex:none}

.drive-st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:#fff;font-size:14px;line-height:1.6}
.drive-st.ok{background:var(--ok50);border-color:transparent;color:var(--ok-ink)}
.drive-st.err{background:var(--warn50);border-color:transparent;color:var(--warn-ink)}
.drive-st.busy{background:var(--lav50);border-color:transparent;color:var(--lav-ink)}

.total-v.sm{font-size:15px}
.paper-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)}
.paper-row:first-of-type{border-top:0}
.paper-k{flex:1 1 11em;font-weight:700;color:var(--m800)}
.paper-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paper-in .inp.num{width:5.2em}
.paper-sum{margin-top:8px;font-family:var(--round);font-weight:700;color:var(--m700);min-height:1.4em}
.trial-set .field{margin-top:12px}
.trial-set .tool-row{align-items:center;margin-top:14px}
.ck-run{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px}
.ck-count{font-family:var(--round);font-weight:700;font-size:20px;color:var(--m700)}

.ck-text{min-height:3em;width:100%;background:var(--cream);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.7}
.ck-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.ck-row{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;background:#fff;border:1px solid var(--line)}
.ck-row.ok{background:var(--ok50);border-color:transparent}

@media (max-width:640px){
  .trial-panel{border-radius:22px;padding:14px 12px}

  .drive-st .btn{margin-left:0}
}

.drive-st>span:not(.ic):not(.llm-think){flex:1;min-width:0}
.done .totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

<noscript><p style="padding:24px">このページを使うには、JavaScript を有効にしてください。</p></noscript>
<script>
/* MAMOA 音声カルテ試作 — 照合エンジン
 * 言語モデルは使わない。決まった語句と数値の照合だけで、カルテの欄ごとの候補を挙げる。
 * 方針：空欄から値を作らない／話者・対象児・時点が分からないものは人に戻す。
 */
(function (root) {
  'use strict';

  var ROLE = { mw: '助産師', mo: '母', fa: '家族', un: '話者不明' };

  var GROUPS = {
    age: { label: '月齢・日齢', scope: 'child', slots: ['ageY', 'ageM', 'ageD'] },
    weight: { label: '体重', scope: 'child', slots: ['weight', 'weightNote'] },
    gain: { label: '増加量', scope: 'child', slots: ['gain'] },
    bf: { label: '母乳', scope: 'child', slots: ['bf', 'bfDay', 'bfNight'] },
    interval: { label: '間隔', scope: 'child', slots: ['intFrom', 'intTo'] },
    milk: { label: 'ミルク', scope: 'child', slots: ['milkTimes', 'milkFrom', 'milkTo'] },
    ebm: { label: '搾母乳', scope: 'child', slots: ['ebmTimes', 'ebmFrom', 'ebmTo'] },
    solid: { label: '離乳食', scope: 'child', slots: ['solidTimes', 'solidNote'] },
    stool: { label: '便回数', scope: 'child', slots: ['stool', 'stoolType'] },
    urine: { label: '尿回数', scope: 'child', slots: ['urine'] },
    wean: { label: '卒乳/断乳', scope: 'child', slots: ['weanType', 'weanDay'] },
    shape: { label: '乳房の形', scope: 'mother', slots: ['shape'] },
    nipple: { label: 'ニップル使用', scope: 'mother', slots: ['nipple'] },
    pump: { label: '搾乳', scope: 'mother', slots: ['pumpTimes', 'pumpType'] },
    areola: { label: '乳頭・乳輪の状態', scope: 'mother', slots: ['areola', 'areolaOther'] },
    pain: { label: '疼痛', scope: 'mother', slots: ['pain', 'painOther'] },
    posture: { label: '授乳姿勢', scope: 'mother', slots: ['posture'] }
  };
  var LINE_GROUPS = {
    dev: { label: '児の発達', scope: 'child' },
    S: { label: 'S）本人・家族の言葉', scope: 'visit' },
    support: { label: '家族などのサポート状況', scope: 'visit' },
    O: { label: 'O）観察', scope: 'visit' },
    P: { label: 'P）計画・実施', scope: 'visit' },
    next: { label: '次の確認', scope: 'visit' }
  };
  var CHILD_GROUPS = ['age', 'weight', 'gain', 'bf', 'interval', 'milk', 'ebm', 'solid', 'stool', 'urine', 'wean'];

  /* ---------------- 正規化 ---------------- */
  var KD = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  function kanjiToNum(k) {
    var total = 0, cur = 0, n = 0, i, ch;
    for (i = 0; i < k.length; i++) {
      ch = k.charAt(i);
      if (Object.prototype.hasOwnProperty.call(KD, ch)) n = n * 10 + KD[ch];
      else if (ch === '十') { cur += (n || 1) * 10; n = 0; }
      else if (ch === '百') { cur += (n || 1) * 100; n = 0; }
      else if (ch === '千') { cur += (n || 1) * 1000; n = 0; }
      else if (ch === '万') { total += ((cur + n) || 1) * 10000; cur = 0; n = 0; }
    }
    return total + cur + n;
  }
  function toHalf(s) {
    return s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/．/g, '.').replace(/，/g, ',').replace(/：/g, ':').replace(/[～~]/g, '〜').replace(/　/g, ' ');
  }
  function norm(src) {
    var s = toHalf(String(src || ''));
    // 単位の表記をそろえる
    s = s.replace(/キログラム|キロ|㎏|ｋｇ|KG|Kg/g, 'kg')
      .replace(/グラム|ｇ|ℊ/g, 'g')
      .replace(/ミリリットル|ミリ|㎖|mL|ML|ｍｌ|シーシー|cc|CC|㏄/g, 'ml')
      .replace(/[ヶヵケカ箇か]月/g, 'か月');
    // 単位の前の漢数字だけを数字にする（「一番」「二人」は変えない）
    s = s.replace(/([〇零一二三四五六七八九十百千万]+)(?=\s*(?:回|g|kg|時間|ml|日|か月|週|歳|度|時|人目|倍))/g, function (m) { return String(kanjiToNum(m)); });
    s = s.replace(/度\s*([一二三四五六七八九])分/g, function (m, a) { return '度' + KD[a] + '分'; });
    s = s.replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
    s = s.replace(/(\d+)\s*時間半/g, function (m, a) { return a + '.5時間'; });
    // 4kg250 → 4250g ／ 4.2kg → 4200g
    s = s.replace(/(\d+(?:\.\d+)?)\s*kg(?:\s*(\d{2,3})(?!\d|\s*(?:回|ml|時間|日|か月))\s*g?)?/g, function (m, kg, ex) {
      return String(Math.round(parseFloat(kg) * 1000) + (ex ? parseInt(ex, 10) : 0)) + 'g';
    });

        driveReady() ? btn('ghost', trial.pinging ? '確かめています…' : '接続先を確かめ直す', function () { drivePing(false, function () { if (document.getElementById('llm-state')) draw(); }); draw(); }, null, { id: 'llm-reping', disabled: trial.pinging }) : null,
        tmp.test ? h('span', { class: tmp.test.ok ? 'llm-ok' : 'llm-err', id: 'llm-test-result' }, tmp.test.msg) : null),
      h('div', { class: 'modal-actions' }, btn('primary', '閉じる', function () { closeModal(); render(); }))), { wide: true, sticky: true });
  }
  llmSetDraw = function () { if (llmSig() !== tmp.sig) draw(); };
  draw();
}

/* ---- 起動 ---- */
function boot() {
  loadStore();
  if (store.settings.llm) { delete store.settings.llm; saveStore(); }            // 前の版の生成AIの設定と、端末に保存していたキーは残さない
  var pc = document.getElementById('player-close');
  if (pc) pc.addEventListener('click', function () { dropAudio(); render(); });
  window.addEventListener('beforeunload', function (ev) {
    saveStore();
    if (state.live || (!trial.locked && driveReady() && qStat().wait)) { ev.preventDefault(); ev.returnValue = ''; }   // 録音中・送り終わる前は、閉じる前に確かめる
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.getElementById('modal') && !state.imp) { closeModal(); } });
  checkLocalSpeech(function () { if (state.screen === 'record' && state.tab === 'talk' && !state.live && !document.getElementById('modal')) render(); });
  render();
  trialBoot();
}
window.__karte = { state: state, store: function () { return store; }, render: render, trial: trial };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
</html>
