<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAMOA - 産後の不安に、温もりが届く。助産師の手のぬくもりを24時間そばに。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MAMOA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAMOA</title>
  <style>
    body { background-color: #FFF7F2; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg,#FDEFF3 0%,#FFF7F2 100%);
      font-family: sans-serif; z-index: 9999; transition: opacity .4s;
    }
    .logo-m {
      width: 96px; height: 96px;
      background: url('icons/Icon-192.png') center/contain no-repeat;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.08);opacity:1} }
    .brand { margin-top: 22px; color:#B68A73; letter-spacing:4px; font-weight:800; font-size:22px; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading">
    <div class="logo-m"></div>
    <div class="brand">MAMOA</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 400); }
    });
  </script>
</body>
</html>
